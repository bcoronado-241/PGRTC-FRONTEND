<div class="app-shell" [class.app-shell--collapsed]="collapsed()">
  <header class="mobile-bar">
    <button
      mat-icon-button
      class="mobile-bar__menu"
      type="button"
      aria-label="Abrir menú de navegación"
      [attr.aria-expanded]="mobileOpen()"
      (click)="toggleMobile()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
    <a class="mobile-bar__brand" routerLink="/dashboard" (click)="closeMobile()">PGRTC</a>
    <span class="mobile-bar__spacer" aria-hidden="true"></span>
  </header>

  @if (mobileOpen()) {
    <div class="sidebar-backdrop" (click)="closeMobile()" aria-hidden="true"></div>
  }

  <aside class="sidebar" [class.sidebar--open]="mobileOpen()">
    <div class="sidebar__header">
      <a class="brand" routerLink="/dashboard" (click)="closeMobile()">
        <span class="brand__mark">PGRTC</span>
      </a>
      <button
        mat-icon-button
        class="sidebar__toggle"
        type="button"
        [attr.aria-expanded]="!collapsed()"
        [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Colapsar menú'"
        (click)="toggleCollapsed()"
      >
        <span class="material-symbols-outlined" aria-hidden="true">
          {{ collapsed() ? 'chevron_right' : 'chevron_left' }}
        </span>
      </button>
    </div>

    <nav class="sidebar__nav" aria-label="Navegación principal">
      @for (link of links; track link.path) {
        <a
          class="nav-link"
          [routerLink]="link.path"
          routerLinkActive="nav-link--active"
          [attr.title]="collapsed() ? link.label : null"
          (click)="closeMobile()"
        >
          <span class="material-symbols-outlined nav-link__icon" aria-hidden="true">
            {{ link.icon }}
          </span>
          <span class="nav-link__label">{{ link.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      @if (currentUser()) {
        <button
          mat-button
          class="user-trigger"
          type="button"
          [matMenuTriggerFor]="userMenu"
          aria-label="Menú de usuario"
        >
          <span class="material-symbols-outlined user-trigger__avatar" aria-hidden="true">
            account_circle
          </span>
          <span class="user-trigger__name">{{ userLabel() }}</span>
          <span class="user-trigger__caret" aria-hidden="true">▾</span>
        </button>
        <mat-menu #userMenu="matMenu" xPosition="after">
          <button mat-menu-item type="button" (click)="goTo('/profile')">
            <span class="menu-item__icon" aria-hidden="true">👤</span>
            <span>Perfil</span>
          </button>
          <button
            mat-menu-item
            type="button"
            class="menu-item--danger"
            (click)="confirmLogout()"
          >
            <span class="menu-item__icon" aria-hidden="true">⏻</span>
            <span>Cerrar sesión</span>
          </button>
        </mat-menu>
      }
    </div>
  </aside>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
